name: GPUI CI

on:
  push:
    branches: [gpui]
  pull_request:
    branches: [gpui]
  workflow_dispatch:
  workflow_call:
    inputs:
      package-artifacts:
        description: Upload the packages validated by this exact-commit quality run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2.9.2
      - name: Source module size
        run: ./scripts/check-source-size.ps1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: ./scripts/run-ci-command.ps1 -LogName tests -Program cargo -CommandArgs @('test', '--workspace', '--locked')
      - name: Isolated Windows clipboard roundtrip
        timeout-minutes: 5
        run: ./scripts/run-ci-command.ps1 -LogName clipboard-smoke -Program cargo -CommandArgs @('run', '-p', 'clipboard-platform', '--example', 'isolated_clipboard_smoke', '--locked')
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed: $LASTEXITCODE" }
      - name: Build Windows package
        run: ./scripts/package-gpui-windows.ps1
      - name: Built and unpacked Windows startup
        timeout-minutes: 3
        run: ./scripts/run-ci-command.ps1 -LogName windows-startup -Program pwsh -CommandArgs @('-File', './scripts/smoke-gpui-windows-package.ps1', '-Archive', (Get-Item target/packages/*-windows-x64.zip).FullName, '-Executable', './target/release/elegant-clipboard-gpui.exe')
      - name: Upload validated Windows package
        if: inputs.package-artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-windows-x64
          path: |
            target/packages/*.zip
            target/packages/*-setup.exe
          if-no-files-found: error
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-logs-windows
          path: target/ci-logs/
          if-no-files-found: ignore

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libasound2-dev libudev-dev xvfb mesa-vulkan-drivers dbus-x11 xdg-utils pulseaudio-utils dpkg-dev rpm
      - uses: swatinem/rust-cache@v2.9.2
      - name: Source module size
        shell: pwsh
        run: ./scripts/check-source-size.ps1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Linux tests in isolated X server
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/run-ci-command.ps1 -LogName tests -Program dbus-run-session -CommandArgs @('--', 'xvfb-run', '-a', 'cargo', 'test', '--workspace', '--locked')
      - name: X11 event ownership and resource release
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          ELEGANT_X11_TEST_SERVER: private-xvfb
        shell: pwsh
        run: ./scripts/run-ci-command.ps1 -LogName x11-ownership -Program dbus-run-session -CommandArgs @('--', 'xvfb-run', '-a', 'cargo', 'test', '-p', 'clipboard-platform', '--locked', 'x11_consumers_keep_events_separate_and_release_owned_resources', '--', '--ignored')
      - name: macOS tests
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./scripts/run-ci-command.ps1 -LogName tests -Program cargo -CommandArgs @('test', '--workspace', '--locked')
      - name: Native package
        shell: pwsh
        run: ./scripts/package-gpui-unix.ps1
      - name: Linux native window smoke
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/run-ci-command.ps1 -LogName linux-startup -Program dbus-run-session -CommandArgs @('--', 'xvfb-run', '-a', './target/release/elegant-clipboard-gpui', '--smoke-test', '--data-dir', "$env:RUNNER_TEMP/elegant-gpui-smoke")
      - name: macOS DMG smoke
        if: runner.os == 'macOS'
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/run-ci-command.ps1 -LogName macos-dmg -Program pwsh -CommandArgs @('-File', './scripts/smoke-gpui-macos-package.ps1', '-Image', (Get-Item target/packages/*-apple-darwin.dmg).FullName)
      - name: Upload validated native package
        if: inputs.package-artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-${{ matrix.os }}
          path: |
            target/packages/*.dmg
            target/packages/*.tar.gz
            target/packages/*.deb
            target/packages/*.rpm
          if-no-files-found: error
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-logs-${{ matrix.os }}
          path: target/ci-logs/
          if-no-files-found: ignore
