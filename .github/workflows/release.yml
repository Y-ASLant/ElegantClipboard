name: GPUI Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2.9.2

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object name -eq 'elegant-clipboard-gpui')
          if ($package.Count -ne 1) {
            throw 'Unable to determine the GPUI package version'
          }
          if ("v$($package[0].version)" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $($package[0].version)"
          }

      - name: Build Windows x64 package
        shell: pwsh
        run: .\scripts\package-gpui-windows.ps1

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/packages/*.zip
            target/packages/*.sha256
