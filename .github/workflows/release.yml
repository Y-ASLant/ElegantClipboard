name: GPUI Release

on:
  push:
    tags:
      - "v*"

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read Cargo metadata: $LASTEXITCODE"
          }
          $package = @($metadata.packages | Where-Object name -eq 'elegant-clipboard-gpui')
          if ($package.Count -ne 1) {
            throw 'Unable to determine the GPUI package version'
          }
          if ("v$($package[0].version)" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $($package[0].version)"
          }

  quality:
    needs: version
    # A local reusable workflow resolves from the tag commit, not a mutable branch.
    uses: ./.github/workflows/gpui.yml
    permissions:
      contents: read
    with:
      package-artifacts: true

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: packages
      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            packages/*.zip
            packages/*.dmg
            packages/*.tar.gz
