[workspace]
members = ["crates/clipboard-core", "crates/clipboard-platform", "crates/clipboard-gpui"]
resolver = "3"

[workspace.package]
version = "2.0.0-beta.9"
edition = "2024"
rust-version = "1.98"
license = "MIT"

# Direct dependencies checked against crates.io on 2026-10-20.
# Commit Cargo.lock; review `cargo update` at the start of each development batch.
[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = "0.4.45"
clipboard-rs = { version = "0.3.5", default-features = false, features = ["image"] }
clipboard-win = "5.4.1"
directories = "6.0.0"
gpui-kit = "0.8.1"
html5ever = "0.40.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6.2"
tray-icon = { version = "0.26.0", default-features = false }
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "tracing-log"] }
windows = "0.62.2"
zstd = "0.14"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
debug = 1

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
