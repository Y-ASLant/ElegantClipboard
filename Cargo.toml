[workspace]
members = ["crates/clipboard-core", "crates/clipboard-platform", "crates/clipboard-gpui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

# Direct dependencies verified against crates.io on 2026-09-18;
# base64, clipboard-win and gpui-kit were checked again on 2026-09-19.
# Commit Cargo.lock; review `cargo update` at the start of each development batch.
[workspace.dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = "0.4.45"
clipboard-rs = { version = "0.3.5", default-features = false, features = ["image"] }
clipboard-win = "5.4.1"
directories = "6.0.0"
gpui-kit = "0.6.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
raw-window-handle = "0.6.2"
tray-icon = { version = "0.25.1", default-features = false }
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tracing = "0.1.44"
windows = "0.62.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
