[package]
name = "elegant-clipboard-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
embed-resource = "3.0.11"

[dependencies]
anyhow.workspace = true
clipboard-core = { path = "../clipboard-core" }

async-channel.workspace = true
clipboard-platform = { path = "../clipboard-platform" }
chrono.workspace = true
gpui-kit.workspace = true
htmd = "0.5.6"
directories.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { workspace = true, features = ["ico"] }
[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon.workspace = true
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { workspace = true, features = ["libappindicator"] }
gtk = "0.18"
x11rb = { version = "0.13", features = ["randr"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
