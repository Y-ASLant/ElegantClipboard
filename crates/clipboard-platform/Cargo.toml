[package]
name = "clipboard-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clipboard-core = { path = "../clipboard-core" }

async-channel.workspace = true
clipboard-rs.workspace = true
directories.workspace = true
image.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
clipboard-win.workspace = true
windows-core = "0.62.2"
windows = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops"] }

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { workspace = true, features = ["wayland"] }
x11rb = { version = "0.13", features = ["xtest", "xinput", "shape", "xfixes", "res"] }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSString", "NSURL", "NSGeometry", "NSThread"] }
global-hotkey = "0.9"
block2 = "0.6"
