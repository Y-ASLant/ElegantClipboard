[package]
name = "clipboard-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clipboard-core = { path = "../clipboard-core" }

async-channel.workspace = true
clipboard-rs.workspace = true
directories.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
clipboard-win.workspace = true
windows-core = "0.62.2"
windows = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Variant", "Win32_System_WinRT", "Data_Xml_Dom", "UI_Notifications"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_StationsAndDesktops"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "=4.18.2", default-features = false, features = ["z"] }
clipboard-rs = { workspace = true, features = ["wayland"] }
x11rb = { version = "0.13", features = ["xtest", "xinput", "shape", "xfixes", "res"] }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotification"] }
global-hotkey = "0.9"
block2 = "0.6"
